<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8e3d6">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png?v=2">
<title>The Fantasy Tails Tribune: Archive</title>
<script>try{if(localStorage.getItem("ftt-admin")!=="1"){location.replace(localStorage.getItem("ftt-ok")==="1"?"./tribune.html":"./index.html");}}catch(e){location.replace("./index.html");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;family=Oswald:wght@400;500;600;700&amp;family=Rye&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#e8e3d6}
body{--paper:#e8e3d6;--ink:#1f1c18;--ink2:#4b463e;color:var(--ink);font-family:'Old Standard TT',Georgia,serif;min-height:100vh;
  background-color:var(--paper);background-image:radial-gradient(ellipse at 15% 8%,rgba(90,70,40,.10),transparent 40%),radial-gradient(ellipse at 88% 70%,rgba(90,70,40,.08),transparent 35%),url(./assets/paper.jpg);
  background-size:auto,auto,512px 512px;background-blend-mode:multiply,multiply,multiply}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.orn{display:flex;align-items:center;gap:12px}
.orn span{flex:1;border-top:3px double var(--ink)}
.orn i{font-style:normal;font-size:20px;line-height:1}
.flag{font-family:'Rye',Georgia,serif;text-align:center;margin:16px 0 0;line-height:1.05}
.flag small{display:block;font-size:clamp(20px,4.4vw,30px);letter-spacing:.06em}
.flag b{display:block;font-weight:400;font-size:clamp(46px,11vw,84px);letter-spacing:.04em}
.folio{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:14px;padding:6px 2px;
  font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.folio a{color:var(--ink)}
@media(max-width:480px){.folio .ed-only{display:none}}
h1{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(34px,7vw,56px);line-height:1;margin:30px 0 6px;border-top:6px double var(--ink);padding-top:14px}
.deck{font-style:italic;font-size:18px;color:var(--ink2);margin:0 0 22px}
.list{list-style:none;margin:0;padding:0}
.ed{border-bottom:1px solid var(--ink)}
.ed a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;padding:16px 4px;color:var(--ink);text-decoration:none}
.ed a:hover .hl,.ed a:focus-visible .hl{text-decoration:underline}
.ed a:focus-visible{outline:3px solid var(--ink2);outline-offset:2px}
.kick{grid-column:1/-1;font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.hl{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(22px,4.6vw,30px);line-height:1.05}
.when{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.sub{grid-column:1/-1;font-style:italic;font-size:16px;color:var(--ink2)}
.now{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid var(--ink);font-size:11px;letter-spacing:.14em;vertical-align:2px}
.fine{margin-top:26px;font-size:14px;font-style:italic;color:var(--ink2);text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="orn" aria-hidden="true"><span></span><i>❦</i><span></span></div>
<div class="flag"><small>The Fantasy Tails</small><b>Tribune</b></div>
<div class="folio"><span>The Archive</span><span class="ed-only">Editors Only</span><a href="./tribune.html">Today's Paper ›</a></div>

<h1>Back Issues</h1>
<p class="deck">Every edition, newest first. Only admins can see this page.</p>
<ul class="list" id="list"></ul>
<p class="fine">Old editions open exactly as they ran, pencil edits included.</p>
</div>

<script>
// ARCHIVE LIST: add the new edition at the top each time one goes out.
// file = the page in the repo, current = true for the edition at tribune.html.
var EDITIONS = [
  { week: 11, vol: 3, date: 'Nov 21, 2026', hl: 'R.I.P. Daniel.', sub: 'Thanks for the memories, you worthless piece of shit.', file: './tribune.html', current: true },
  { week: 11, vol: 2, date: 'Nov 19, 2026', hl: 'Thursday Night Toilet Bowl', sub: 'Eight of this league’s twelve teams have a starter in this shitshow.', file: './tribune-2026-week-11-vol-2.html' },
  { week: 11, vol: 1, date: 'Nov 17, 2026', hl: 'Das Boot.', sub: 'Drake Maye’s ankle breaks, and so does Nick’s spirit.', file: './tribune-2026-week-11-vol-1.html' }
];
(function () {
  var ul = document.getElementById('list');
  EDITIONS.forEach(function (e) {
    var li = document.createElement('li'); li.className = 'ed';
    var a = document.createElement('a'); a.href = e.file;
    var k = document.createElement('span'); k.className = 'kick';
    k.textContent = 'Week ' + e.week + ' · Volume ' + e.vol;
    if (e.current) { var n = document.createElement('span'); n.className = 'now'; n.textContent = 'Current'; k.appendChild(n); }
    var h = document.createElement('span'); h.className = 'hl'; h.textContent = e.hl;
    var w = document.createElement('span'); w.className = 'when'; w.textContent = e.date;
    var s = document.createElement('span'); s.className = 'sub'; s.textContent = e.sub;
    a.appendChild(k); a.appendChild(h); a.appendChild(w); a.appendChild(s);
    li.appendChild(a); ul.appendChild(li);
  });
})();
</script>
<script>try{if(localStorage.getItem("ftt-admin")==="1")window.goatcounter={path:function(p){return "/admin"+(p||location.pathname);},title:"Admin visit"};}catch(e){}</script>
<script data-goatcounter="https://fantasy-tails-tribune.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
